name: web image

# Publishes the `web` target of Dockerfile.goreleaser to GHCR on every push to `web-ui`, tagged
# `latest` and with the full commit hash. The proxy image is published separately by GoReleaser, so
# this uses its own package name (`<repo>-web`) and the two `:latest` tags cannot collide.

on:
  push:
    branches:
      - web-ui
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight build instead of queueing behind it.
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The web target's runtime stage compiles libavif, libheif and ImageMagick from source, so the
    # first uncached build is long. Later runs reuse the GitHub Actions layer cache.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name, which GHCR requires.
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.goreleaser
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The apt installs and the from-source codec builds dominate the build time, so caching
          # those layers is what makes repeat builds quick.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep a plain single-manifest image so `docker compose pull` stays predictable.
          provenance: false
          sbom: false
